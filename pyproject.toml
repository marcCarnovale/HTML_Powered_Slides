[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "html-powered-slides"
version = "0.1.0"
description = "Generate themed HTML presentations from YAML or JSON."
readme = "readme.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
html-powered-slides = "main:main"

[tool.setuptools]
py-modules = ["main", "helper"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
